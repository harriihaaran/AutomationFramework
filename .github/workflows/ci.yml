name: CI Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'

    - name: Build with Maven
      run: mvn clean install

